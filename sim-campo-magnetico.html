<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Z — Simulador Campo Magnético</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;user-select:none;}
#c{display:block;}
#nav{position:fixed;top:0;left:0;right:0;height:34px;background:rgba(0,0,0,.8);
     border-bottom:1px solid #111;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:10;}
#nav a{font-size:11px;color:#555;text-decoration:none;}
#nav a:hover{color:#06b6d4;}
#nav span{font-size:12px;font-weight:800;color:#ddd;text-transform:uppercase;letter-spacing:.05em;}
#hint{position:fixed;top:44px;right:14px;font-size:11px;color:#555;z-index:10;pointer-events:none;}
#ctrls{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);
       background:rgba(14,14,14,.88);border-radius:12px;padding:12px 28px;
       display:flex;gap:36px;align-items:center;z-index:10;}
.ctrl{display:flex;flex-direction:column;gap:5px;}
.lbl{font-size:10px;font-weight:700;letter-spacing:.1em;color:#888;text-transform:uppercase;}
.lbl b{color:#f97316;}
input[type=range]{-webkit-appearance:none;width:140px;height:4px;border-radius:2px;
                  background:#2a2a2a;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:#f97316;cursor:pointer;box-shadow:0 0 8px #f9731688;}
#info{position:fixed;bottom:0;left:0;right:0;background:rgba(8,15,22,.92);
      border-top:1px solid #0d2233;padding:12px 20px;display:flex;
      align-items:flex-start;gap:12px;z-index:10;}
.ic{width:22px;height:22px;border-radius:50%;background:#082f44;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px;}
#info p{font-size:13px;color:#bbb;line-height:1.55;}
</style>
</head>
<body>
<div id="nav">
  <a href="index.html">← Panel</a>
  <span>🧲 Simulador Campo Magnético</span>
</div>
<div id="hint">Mouse: Rotar/Zoom</div>
<canvas id="c"></canvas>
<div id="ctrls">
  <div class="ctrl">
    <div class="lbl">Densidad de líneas: <b id="vl">24</b></div>
    <input type="range" id="sl" min="6" max="48" step="6" value="24" oninput="rebuild()">
  </div>
  <div class="ctrl">
    <div class="lbl">Espiras: <b id="vt">8</b></div>
    <input type="range" id="st" min="2" max="20" step="1" value="8" oninput="rebuild()">
  </div>
</div>
<div id="info">
  <div class="ic">ℹ</div>
  <p>El campo magnético describe la influencia de imanes y corrientes eléctricas. Su dirección e intensidad son claves para entender motores, sensores, bobinas y transformadores.</p>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

// View state
let theta = 0.5, phi = 0.3, zoom = 1;
let drag = false, lx = 0, ly = 0;

function resize() {
  W = window.innerWidth  || document.documentElement.clientWidth  || 1280;
  H = window.innerHeight || document.documentElement.clientHeight || 720;
  canvas.width = W; canvas.height = H;
  redraw();
}

// 3D → 2D projection
function proj(x, y, z) {
  // Rotate around Y (theta)
  const ct=Math.cos(theta), st=Math.sin(theta);
  const x1=x*ct+z*st, y1=y, z1=-x*st+z*ct;
  // Rotate around X (phi = tilt)
  const cp=Math.cos(phi), sp=Math.sin(phi);
  const x2=x1, y2=y1*cp-z1*sp, z2=y1*sp+z1*cp;
  // Perspective
  const cam=14;
  const s = cam/(cam+z2) * zoom * (W/6);
  return { sx: W/2+x2*s, sy: H/2-H*0.04+y2*s, d: z2 };
}

// ---- Geometry builders ----

// Solenoid helix points [x,y,z]
function mkSolenoid(turns) {
  const pts=[], N=turns*72, L=turns*0.44;
  for(let i=0;i<=N;i++){
    const t=i/N, a=t*turns*Math.PI*2;
    pts.push([Math.cos(a)*0.85, (t-0.5)*L, Math.sin(a)*0.85]);
  }
  return pts;
}

// Dipole B-field
function dipoleB(x,y,z,L){
  const ny=L/2, sy=-L/2;
  let bx=0,by=0,bz=0;
  const f=(px,py,pz,sign)=>{
    const dx=x-px,dy=y-py,dz=z-pz;
    const r=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.04;
    const r3=r*r*r;
    bx+=sign*dx/r3; by+=sign*dy/r3; bz+=sign*dz/r3;
  };
  f(0,ny,0,1); f(0,sy,0,-1);
  return [bx,by,bz];
}

function traceLine(x0,y0,z0,L,steps,step){
  const pts=[[x0,y0,z0]];
  let x=x0,y=y0,z=z0;
  for(let i=0;i<steps;i++){
    const [bx,by,bz]=dipoleB(x,y,z,L);
    const bm=Math.sqrt(bx*bx+by*by+bz*bz);
    if(bm<1e-7) break;
    x+=bx/bm*step; y+=by/bm*step; z+=bz/bm*step;
    if(x*x+y*y+z*z>144) break;
    pts.push([x,y,z]);
  }
  return pts;
}

function mkFieldLines(nL, turns){
  const L=turns*0.44, lines=[];
  // Outer field lines from top pole (dipole looping pattern)
  const radii=[1.0,1.35,1.75,2.2,2.8];
  for(const r of radii){
    for(let ai=0;ai<nL;ai++){
      const a=ai*Math.PI*2/nL;
      lines.push(traceLine(r*Math.cos(a), L/2*0.55, r*Math.sin(a), L, 420, 0.09));
    }
  }
  // Inner axis lines (inside solenoid, going up)
  const innerR=[0.3,0.58];
  for(const r of innerR){
    const n=Math.max(4,Math.round(nL/3));
    for(let ai=0;ai<n;ai++){
      const a=ai*Math.PI*2/n;
      lines.push(traceLine(r*Math.cos(a), -L/2*0.88, r*Math.sin(a), L, 260, -0.09));
    }
  }
  return lines;
}

// ---- Cached geometry ----
let solenoidPts=[], fieldLines=[];

function rebuild(){
  const nL=parseInt(document.getElementById('sl').value);
  const nT=parseInt(document.getElementById('st').value);
  document.getElementById('vl').textContent=nL;
  document.getElementById('vt').textContent=nT;
  solenoidPts = mkSolenoid(nT);
  fieldLines  = mkFieldLines(nL, nT);
  redraw();
}

// ---- Draw ----
function drawGrid(){
  const size=10;
  ctx.lineWidth=1;
  for(let i=-size;i<=size;i++){
    // along Z
    const a=proj(i,-3,-size), b=proj(i,-3,size);
    ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy);
    ctx.strokeStyle='#06101a'; ctx.stroke();
    // along X
    const c=proj(-size,-3,i), d=proj(size,-3,i);
    ctx.beginPath(); ctx.moveTo(c.sx,c.sy); ctx.lineTo(d.sx,d.sy);
    ctx.strokeStyle='#06101a'; ctx.stroke();
  }
}

function depthAlpha(d, base, range){
  // d in ~[-3,3]: front=bright, back=dim
  return Math.min(1, Math.max(0.08, base - d*range));
}

function drawFieldLines(){
  for(const line of fieldLines){
    if(line.length<2) continue;
    const ps=line.map(p=>proj(p[0],p[1],p[2]));
    // draw as series of short strokes with depth-based opacity
    for(let i=0;i<ps.length-1;i++){
      const a=ps[i],b=ps[i+1];
      const al=depthAlpha((a.d+b.d)/2, 0.72, 0.055);
      ctx.beginPath();
      ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy);
      ctx.strokeStyle=`rgba(208,152,16,${al.toFixed(2)})`;
      ctx.lineWidth=1;
      ctx.stroke();
    }
  }
}

function drawSolenoid(){
  const ps=solenoidPts.map(p=>proj(p[0],p[1],p[2]));
  for(let i=0;i<ps.length-1;i++){
    const a=ps[i],b=ps[i+1];
    const d=(a.d+b.d)/2;
    // depth shading: front = bright orange, back = dark red
    const bright=Math.min(1,Math.max(0.3, 0.6-d*0.12));
    const al=Math.min(1,Math.max(0.25, 0.6-d*0.1));
    const r=Math.round(235*bright), g=Math.round(80*bright), bv=Math.round(8*bright);
    // Line width scales with projection scale
    const lw=Math.max(1.5, 3.5*(a.sx!==b.sx||a.sy!==b.sy?1:0));
    ctx.beginPath();
    ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy);
    ctx.strokeStyle=`rgba(${r},${g},${bv},${al.toFixed(2)})`;
    ctx.lineWidth=lw;
    ctx.stroke();
  }
}

function redraw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  drawGrid();
  drawFieldLines();
  drawSolenoid();
}

// ---- Input ----
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{
  if(!drag) return;
  theta-=(e.clientX-lx)*0.006;
  phi=Math.max(-1.3,Math.min(1.3,phi+(e.clientY-ly)*0.006));
  lx=e.clientX; ly=e.clientY;
  redraw();
});
canvas.addEventListener('wheel',e=>{
  zoom=Math.max(0.35,Math.min(2.8,zoom-e.deltaY*0.001));
  redraw(); e.preventDefault();
},{passive:false});

// Touch
let tDrag=false,tlx=0,tly=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){tDrag=true;tlx=e.touches[0].clientX;tly=e.touches[0].clientY;}
});
canvas.addEventListener('touchend',()=>tDrag=false);
canvas.addEventListener('touchmove',e=>{
  if(!tDrag||e.touches.length!==1) return;
  const t=e.touches[0];
  theta-=(t.clientX-tlx)*0.006;
  phi=Math.max(-1.3,Math.min(1.3,phi+(t.clientY-tly)*0.006));
  tlx=t.clientX; tly=t.clientY;
  redraw(); e.preventDefault();
},{passive:false});

window.addEventListener('resize',resize);
resize();
rebuild();
</script>
</body>
</html>
