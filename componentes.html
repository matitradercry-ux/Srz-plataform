        body { background: radial-gradient(ellipse at 50% 20%, #1a2744 0%, #0a0f1e 55%, #060a14 100%); min-height:100vh; }

<body class="text-slate-100 font-sans">

<!-- Modal API Key -->
<div id="modal-config" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[#0d1321] border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
        <h3 class="text-sm font-bold uppercase text-cyan-400 mb-2">⚙️ Conexión Gemini API</h3>
        <p class="text-xs text-slate-400 mb-4">API Key para análisis de componentes no indexados localmente.</p>
        <input id="api-key-input" type="password" placeholder="AIzaSy..." class="w-full bg-[#070a12] border border-slate-800 p-2.5 rounded-xl font-mono text-xs focus:outline-none focus:border-cyan-500 mb-4" />
        <div class="flex justify-end gap-2">
            <button onclick="toggleModal()" class="text-xs text-slate-400 px-3 py-2">Cerrar</button>
            <button onclick="guardarKey()" class="bg-cyan-500 text-slate-950 text-xs font-bold px-4 py-2 rounded-lg">Guardar</button>
        </div>
    </div>
</div>

<!-- Header -->
<div class="border-b border-slate-800/80 bg-slate-950/70 backdrop-blur-sm sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-5 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="index.html" class="text-xs text-slate-500 hover:text-cyan-400 transition">← Inicio</a>
            <span class="text-slate-700">|</span>
            <a href="laboratorio.html" class="text-xs text-slate-500 hover:text-cyan-400 transition">Laboratorio</a>
            <span class="text-slate-700">|</span>
            <span class="text-base font-black uppercase tracking-wide text-slate-200">🔌 Componentes</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="badge-modo" class="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded-md border border-emerald-500/20">⚡ BD Local Activa</span>

        svgLines += `<line x1="10" y1="${y}" x2="70" y2="${y}" stroke="${c}" stroke-width="2"/>
        <circle cx="10" cy="${y}" r="4" fill="${c}"/>
        <text x="14" y="${y-5}" fill="${c}" font-size="7" font-family="monospace">${i+1}·${nombreCorto(p)}</text>`;
    });
    der.forEach((p, i) => {
        const y = 38 + i * 32; const c = getColor(mitad + i);
        svgLines += `<line x1="170" y1="${y}" x2="230" y2="${y}" stroke="${c}" stroke-width="2"/>
        <circle cx="230" cy="${y}" r="4" fill="${c}"/>
        <text x="172" y="${y-5}" fill="${c}" font-size="7" font-family="monospace">${mitad+i+1}·${nombreCorto(p)}</text>`;
    });
    return svgLines + `</svg>`;
}

    document.getElementById('resultado-container').innerHTML = `
        <div class="bg-[#0d1321] border border-slate-700 rounded-xl p-8 text-center fade-in">
            <div class="text-4xl mb-3">🔍</div>

                    <a href="https://www.alldatasheet.com/search/?q=${encodeURIComponent(query)}" target="_blank" class="block bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs px-4 py-2 rounded-lg w-full text-center transition">Buscar Datasheet ↗</a>
                </div>

}

async function buscarComponente() {
    const query = document.getElementById('input-busqueda').value.trim();
    if(!query) return;
    const btn = document.getElementById('btn-buscar');
    btn.innerText = "⏳"; btn.disabled = true;
    const keyLimpia = query.toLowerCase().replace(/[\s\-_]/g, '');
    const apiKey = localStorage.getItem('gemini_api_key');
    if (BD_LOCAL[keyLimpia]) {
        datosComponente = BD_LOCAL[keyLimpia];
        imprimirPantalla();
        btn.innerText = "Analizar"; btn.disabled = false;
        return;
    }
    if(apiKey) {
        try {
            document.getElementById('resultado-container').innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">Consultando Gemini AI...</div>`;
            const prompt = `Eres un Ingeniero Electrónico experto. Analiza el componente electrónico: "${query}". Responde EXCLUSIVAMENTE con un objeto JSON plano (sin markdown, sin \`\`\`, sin texto extra) con esta estructura exacta: {"termino":"${query.toUpperCase()}","categoria":"...","descripcion":"...","vccMax":"...","encapsulado":"...","imagen":"","aspectosClave":["detalle técnico 1","detalle técnico 2","detalle técnico 3","detalle técnico 4"],"pines":["Pin 1 — nombre (función)","Pin 2 — nombre (función)"],"pinoutKey":"default"}`;
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({contents:[{parts:[{text:prompt}]}]})
            });
            const data = await res.json();
            let txt = data.candidates[0].content.parts[0].text.replace(/```json/g,"").replace(/```/g,"").trim();
            datosComponente = JSON.parse(txt);
            imprimirPantalla();
            document.getElementById('badge-modo').textContent = '☁️ Gemini AI';
            document.getElementById('badge-modo').className = 'text-[10px] font-mono text-purple-400 bg-purple-500/10 px-2 py-1 rounded-md border border-purple-500/20';
        } catch(e) { mostrarNoEncontrado(query); }
    } else { mostrarNoEncontrado(query); }
    btn.innerText = "Analizar"; btn.disabled = false;
}

function buscarRapido(termino) {
    document.getElementById('input-busqueda').value = termino;
    buscarComponente();
}

function toggleModal() {
    document.getElementById('modal-config').classList.toggle('hidden');
    document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || '';
}
function guardarKey() {
    localStorage.setItem('gemini_api_key', document.getElementById('api-key-input').value.trim());
    toggleModal();
    document.getElementById('badge-modo').textContent = '☁️ Gemini Conectado';
    document.getElementById('badge-modo').className = 'text-[10px] font-mono text-purple-400 bg-purple-500/10 px-2 py-1 rounded-md border border-purple-500/20';
}

window.onload = () => {
    const q = localStorage.getItem('query_busqueda_inicial');
    if(q) { document.getElementById('input-busqueda').value = q; localStorage.removeItem('query_busqueda_inicial'); setTimeout(buscarComponente, 100); }
    document.getElementById('input-busqueda').addEventListener('keydown', e => { if(e.key==='Enter') buscarComponente(); });
    buscarRapido('NE555');
};
