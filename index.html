                        <div>
                            <button onclick="cambiarVista('home')" class="text-xs text-slate-500 hover:text-orange-400 transition mb-0.5 block">← Panel Central</button>
                            <h1 class="text-base font-black text-slate-200 uppercase tracking-wide">SMC Trading Command</h1>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="flex bg-[#0d1321] p-0.5 rounded-lg border border-slate-800">
                                <button onclick="seleccionarPar('US30')" class="px-3 py-0.5 text-xs font-bold rounded-md ${estado.parSeleccionado === 'US30' ? 'bg-orange-500 text-slate-950' : 'text-slate-400'}">US30</button>
                                <button onclick="seleccionarPar('BTC')" class="px-3 py-0.5 text-xs font-bold rounded-md ${estado.parSeleccionado === 'BTC' ? 'bg-orange-500 text-slate-950' : 'text-slate-400'}">BTC</button>
                            </div>
                            <button onclick="toggleCalculadora()" class="bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold text-xs px-3 py-1 rounded-md">🧮 Gestión de Riesgo</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-2 mb-2">
                        <div class="bg-[#0d1321] border border-slate-800 rounded-xl overflow-hidden shadow-lg">
                            <div class="bg-slate-950/80 px-3 py-1 text-[10px] font-bold text-slate-400 border-b border-slate-900 flex justify-between uppercase tracking-wider">
                                <span>📅 Calendario Macroeconómico de Alta Relevancia</span>
                            </div>
                            <div class="calendario-wrapper">
                                <iframe src="https://sslecal2.investing.com?eco_ticker=false&columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&features=datepicker,timezone&countries=5,22,110,43,17,42,26,10,25,32&calType=day&timeZone=58&lang=5" frameborder="0" allowtransparency="true" style="filter: invert(93%) hue-rotate(180deg) contrast(115%) opacity(0.85);"></iframe>
                            </div>
                        </div>
                        <div class="bg-[#0d1321] border border-slate-800 rounded-xl overflow-hidden flex flex-col shadow-lg">
                            <div class="bg-slate-950/80 px-3 py-1 text-[10px] font-bold text-cyan-400 border-b border-slate-900 uppercase">📊 Correlación Macro de Activos (En Vivo)</div>
                            <div class="w-full flex-1 min-h-[130px] bg-slate-950" id="tv-ticker-tape-container"></div>
                        </div>
                    </div>

                    <div class="w-full bg-[#0d1321]/60 border border-slate-800 rounded-xl p-1.5 h-[620px] flex flex-col relative mb-2 shadow-2xl">
                        <div id="tv-chart-container" class="w-full flex-1 rounded-lg overflow-hidden border border-slate-800 bg-slate-950"></div>
                        
                        <div id="calc-panel" class="absolute top-2 right-2 bg-[#0d1321] border border-orange-500/40 rounded-xl p-4 w-72 shadow-2xl transition-all ${estado.calculadoraAbierta ? 'opacity-100 scale-100' : 'opacity-0 scale-95 pointer-events-none'}">
                            <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-1.5">
                                <h3 class="text-orange-400 text-xs font-bold uppercase">🧮 Calculadora de Lotaje</h3>
                                <button onclick="toggleCalculadora()" class="text-slate-500 text-xs">✕</button>
                            </div>
                            <div class="space-y-3 text-xs">
                                <div><label class="text-slate-400 block mb-0.5">Balance Cuenta (USD)</label><input id="input-balance" type="number" value="${estado.balanceCuenta}" class="w-full bg-[#070a12] border border-slate-800 p-2 rounded-lg font-mono focus:outline-none" /></div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div><label class="text-slate-400 block mb-0.5">Riesgo (%)</label><input id="input-riesgo" type="number" step="0.25" value="${estado.riesgoPorcentaje}" class="w-full bg-[#070a12] border border-slate-800 p-2 rounded-lg font-mono focus:outline-none" /></div>
                                    <div><label class="text-slate-400 block mb-0.5">Stop Loss (Pips)</label><input id="input-sl" type="number" value="${estado.stopLossPips}" class="w-full bg-[#070a12] border border-slate-800 p-2 rounded-lg font-mono focus:outline-none" /></div>
                                </div>
                                <div class="bg-slate-950 p-3 rounded-lg border border-slate-900 font-mono text-center">
                                    <div id="calc-neto" class="text-[10px] text-red-400">Riesgo Neto: -${dineroEnRiesgo} USD</div>
                                    <div class="text-slate-200 font-bold mt-1">Lotaje Sugerido: <span id="calc-lotaje" class="text-emerald-400 text-sm">${lotajeCalculado}</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function cargarWidgetsTradingView() {
            const ticker = estado.parSeleccionado === "US30" ? "BLACKBULL:US30" : "BINANCE:BTCUSDT";
            if(document.getElementById('tv-chart-container')) {
                new TradingView.widget({ 
                    "autosize": true, 
                    "symbol": ticker, 
                    "interval": "15", 
                    "timezone": "America/Argentina/Buenos_Aires", 
                    "theme": "dark", 
                    "style": "1", 
                    "locale": "es", 
                    "container_id": "tv-chart-container" 
                });
            }
            if(document.getElementById('tv-ticker-tape-container')) {
                const container = document.getElementById('tv-ticker-tape-container');
                container.innerHTML = "";
                const scriptWidget = document.createElement('script');
                scriptWidget.type = 'text/javascript';
                scriptWidget.src = 'https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';
                scriptWidget.async = true;
                scriptWidget.innerHTML = JSON.stringify({
                    "symbols": [
                        { "proName": "CAPITALCOM:DXY", "title": "DXY" },
                        { "proName": "NASDAQ:QQQ", "title": "NASDAQ 100" },
                        { "proName": "AMEX:SPY", "title": "S&P 500" },
                        { "proName": "TVC:USOIL", "title": "Crudo WTI" },
                        { "proName": "TVC:GOLD", "title": "Oro" },
                        { "proName": "BINANCE:BTCUSDT", "title": "BTC" }
                    ],
                    "showSymbolLogo": true,
                    "colorTheme": "dark", 
                    "isTransparent": true, 
                    "displayMode": "adaptive", 
                    "locale": "es" 
                });
                container.appendChild(scriptWidget);
            }
            vincularEventos();
        }

        function vincularEventos() {
            const buscador = document.getElementById('buscador-input');
            if (buscador) {
                buscador.addEventListener('input', (e) => { 
                    estado.busqueda = e.target.value; 
                    render(); 
                    const input = document.getElementById('buscador-input'); 
                    if(input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); } 
                });
                buscador.addEventListener('keydown', (e) => { if(e.key === 'Enter') consultarIA(); });
            }
            const iBalance = document.getElementById('input-balance'); if (iBalance) iBalance.addEventListener('input', (e) => { estado.balanceCuenta = parseFloat(e.target.value) || 0; actualizarCalculos(); });
            const iRiesgo = document.getElementById('input-riesgo'); if (iRiesgo) iRiesgo.addEventListener('input', (e) => { estado.riesgoPorcentaje = parseFloat(e.target.value) || 0; actualizarCalculos(); });
            const iSL = document.getElementById('input-sl'); if (iSL) iSL.addEventListener('input', (e) => { estado.stopLossPips = parseFloat(e.target.value) || 0; actualizarCalculos(); });
        }

        function actualizarCalculos() {
            const dinero = estado.balanceCuenta * (estado.riesgoPorcentaje / 100);
            const lotaje = (dinero / (estado.stopLossPips * 10)).toFixed(2);
            const elNeto = document.getElementById('calc-neto');
            const elLotaje = document.getElementById('calc-lotaje');
            if(elNeto) elNeto.innerText = `Riesgo Neto: -${dinero} USD`;
            if(elLotaje) elLotaje.innerText = lotaje;
        }

        function toggleCalculadora() { estado.calculadoraAbierta = !estado.calculadoraAbierta; const panel = document.getElementById('calc-panel'); if(panel) panel.classList.toggle('opacity-0'); panel.classList.toggle('scale-95'); panel.classList.toggle('pointer-events-none'); }
        function seleccionarPar(par) { estado.parSeleccionado = par; render(); }
        function cambiarVista(nuevaVista) { estado.vistaActual = nuevaVista; estado.busqueda = ""; estado.iaRespuesta = null; render(); }

        function setQuery(texto) {
            estado.busqueda = texto;
            render();
            setTimeout(() => { const input = document.getElementById('buscador-input'); if(input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); } }, 50);
        }

        function limpiarRespuesta() { estado.iaRespuesta = null; render(); }

        function abrirConfigIA() {
            const modal = document.getElementById('modal-ia');
            if(modal) { modal.classList.remove('hidden'); document.getElementById('ia-key-input').value = localStorage.getItem('gemini_api_key') || ''; }
        }
        function cerrarConfigIA() { document.getElementById('modal-ia')?.classList.add('hidden'); }
        function guardarKeyIA() { localStorage.setItem('gemini_api_key', document.getElementById('ia-key-input').value.trim()); cerrarConfigIA(); }

        async function consultarIA() {
            const query = estado.busqueda.trim();
            if (!query) return;
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) { render(); return; }

            estado.iaCargando = true;
            estado.iaRespuesta = null;
            render();

            try {
                const prompt = `Sos el asistente personal de Sr. Z, docente de electrónica y trader activo en US30 y BTC. Respondé en español, de forma directa y técnica, sin rodeos. Usá formato claro con saltos de línea cuando corresponda. Pregunta: "${query}"`;
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                estado.iaRespuesta = data.candidates[0].content.parts[0].text.trim();
            } catch(e) {
                estado.iaRespuesta = "❌ Error al conectar con Gemini. Verificá tu API Key en ⚙️.";
            }
            estado.iaCargando = false;
            render();
            vincularEventos();
        }

        render();
    </script>
</body>
</html>
