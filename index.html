<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.25s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #070a12; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        .calendario-wrapper { position: relative; width: 100%; height: 160px; overflow: hidden; }
        .calendario-wrapper iframe { position: absolute; top: 0; left: 0; width: 200%; height: 100%; transform: scale(0.98); transform-origin: top left; }
        .chat-msg-user { background: #0f1f35; border-left: 2px solid #0ea5e9; }
        .chat-msg-ia   { background: #070a12; border-left: 2px solid #1e293b; }
        .md-h2  { color: #7dd3fc; font-weight: 700; font-size: 1rem; margin: 10px 0 4px; display:block; }
        .md-h3  { color: #38bdf8; font-weight: 700; font-size: .875rem; margin: 8px 0 3px; display:block; }
        .md-li  { display: flex; gap: 6px; margin: 2px 0; }
        .md-dot { color: #06b6d4; flex-shrink: 0; }
        .md-code{ background:#1e293b; color:#67e8f9; padding:1px 5px; border-radius:4px; font-family:monospace; font-size:.8em; }
        .md-h1  { color:#e2e8f0; font-weight:800; font-size:1.1rem; margin:12px 0 5px; display:block; }
        .md-pre { background:#0d1321; border:1px solid #1e293b; border-radius:8px; padding:12px 14px; margin:8px 0; overflow-x:auto; }
        .md-pre code { color:#67e8f9; font-family:monospace; font-size:.8em; white-space:pre; }
        .md-hr  { border:none; border-top:1px solid #1e293b; margin:10px 0; }
        .md-quote { border-left:3px solid #0ea5e9; padding:4px 10px; background:#0f1f35; margin:6px 0; color:#94a3b8; border-radius:0 4px 4px 0; font-size:.85em; }
        .md-math-block { background:#0d1321; border:1px solid #1e293b; border-radius:6px; padding:8px 12px; margin:6px 0; overflow-x:auto; text-align:center; }
        .katex { color:#e2e8f0; }
        .katex-display { overflow-x:auto; overflow-y:hidden; }
        .md-img-note { background:#1a2035; border:1px dashed #334155; border-radius:6px; padding:6px 10px; margin:4px 0; color:#64748b; font-size:.78em; font-style:italic; }
        nav.srz-nav { position:fixed; top:0; left:0; right:0; z-index:40; background:rgba(7,10,18,0.92); backdrop-filter:blur(12px); border-bottom:1px solid rgba(30,41,59,0.6); }
    </style>
</head>
<body class="bg-[#070a12] text-slate-100 font-sans overflow-x-hidden pb-12">

    <div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-cyan-500/5 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute top-1/3 right-1/4 w-[500px] h-[500px] bg-orange-500/5 rounded-full blur-[140px] pointer-events-none"></div>
    <div id="app-container"></div>

    <script>
        const LINK_DRIVE_RAIZ = "https://drive.google.com/drive/u/1/folders/1RU6Vg3VMCQaI0j7tWaHcihCiFekUZhMf";

        // Pip value USD por lote estandar por instrumento
        const INST = {
            'US30':   { tv:'BLACKBULL:US30',   pip:1,  label:'US30',     unidad:'puntos' },
            'BTC':    { tv:'BINANCE:BTCUSDT',  pip:1,  label:'BTC',      unidad:'USD' },
            'GOLD':   { tv:'TVC:GOLD',         pip:10, label:'Oro',      unidad:'pips' },
            'OIL':    { tv:'TVC:USOIL',        pip:10, label:'Crudo',    unidad:'pips' },
            'EURUSD': { tv:'FX:EURUSD',        pip:10, label:'EUR/USD',  unidad:'pips' }
        };

        let estado = {
            busqueda: "",
            vistaActual: "home",
            parSeleccionado: "US30",
            symbolCustom: null,
            calculadoraAbierta: false,
            balanceCuenta: 10000,
            riesgoPorcentaje: 1,
            stopLossPips: 20,
            chatHistorial: [],
            iaCargando: false,
            imagenPendiente: null   // {dataUrl, mimeType, base64}
        };

        // ─── MATH RENDER ────────────────────────────────────────────────────────────
        function renderMath(math, display) {
            if (typeof katex !== 'undefined') {
                try { return katex.renderToString(math.trim(), { displayMode: !!display, throwOnError: false }); }
                catch(e) {}
            }
            return display
                ? `<div class="md-math-block">${math}</div>`
                : `<span class="md-code">${math}</span>`;
        }

        // ─── MARKDOWN ───────────────────────────────────────────────────────────────
        function md(text) {
            // 1. Protect code blocks
            const blocks = [];
            text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
                const i = blocks.length;
                const safe = code.trim().replace(/</g,'&lt;').replace(/>/g,'&gt;');
                blocks.push(`<pre class="md-pre"><code>${safe}</code></pre>`);
                return `\x00BLK${i}\x00`;
            });
            // 2. Display math $$...$$
            text = text.replace(/\$\$([^$]+)\$\$/g, (_, m) => {
                const i = blocks.length;
                blocks.push(`<div class="md-math-block">${renderMath(m, true)}</div>`);
                return `\x00BLK${i}\x00`;
            });
            // 3. Images → note (can't embed external images safely)
            text = text.replace(/!\[([^\]]*)\]\([^)]+\)/g, (_, alt) =>
                `<div class="md-img-note">🖼 Imagen: ${alt || 'sin descripción'} — buscá en Google Imágenes</div>`
            );

            const lines = text.split('\n');
            let out = '';
            for (let line of lines) {
                // Restore protected blocks
                const blkMatch = line.match(/^\x00BLK(\d+)\x00$/);
                if (blkMatch) { out += blocks[+blkMatch[1]]; continue; }

                const t = line.trimStart();
                if      (t.startsWith('# '))   out += `<div class="md-h1">${t.slice(2)}</div>`;
                else if (t.startsWith('## '))  out += `<div class="md-h2">${t.slice(3)}</div>`;
                else if (t.startsWith('### ')) out += `<div class="md-h3">${t.slice(4)}</div>`;
                else if (/^[-*]\s/.test(t))    out += `<div class="md-li"><span class="md-dot">›</span><span>${t.slice(2)}</span></div>`;
                else if (/^\d+\.\s/.test(t))   out += `<div class="md-li"><span class="md-dot">${t.match(/^\d+/)[0]}.</span><span>${t.replace(/^\d+\.\s/,'')}</span></div>`;
                else if (/^---+$/.test(t))     out += '<hr class="md-hr"/>';
                else if (t.startsWith('> '))   out += `<div class="md-quote">${t.slice(2)}</div>`;
                else if (t === '')             out += '<div class="mt-2"></div>';
                else                           out += `<div>${line}</div>`;
            }

            // Inline math $...$, bold, italic, code
            return out
                .replace(/\$([^$\n<]{1,120})\$/g, (_, m) => renderMath(m, false))
                .replace(/\*\*(.+?)\*\*/gs, '<strong class="text-slate-100">$1</strong>')
                .replace(/\*(.+?)\*/g, '<em class="text-slate-300">$1</em>')
                .replace(/`([^`]+)`/g, '<span class="md-code">$1</span>');
        }

        // ─── RENDER ─────────────────────────────────────────────────────────────────
        function render() {
            const c = document.getElementById('app-container');
            if (estado.vistaActual === 'trading_hub') {
                c.innerHTML = renderTradingHub();
                setTimeout(cargarWidgets, 30);
            } else {
                c.innerHTML = renderHome();
                vincularEventos();
                setTimeout(cargarTickerHome, 80);
                setTimeout(cargarMercado, 120);
            }
        }

        function renderHome() {
            const apiKey = localStorage.getItem('gemini_api_key');

            // Chat panel
            let chatHTML = estado.chatHistorial.map(msg => msg.role === 'user'
                ? `<div class="chat-msg-user rounded-lg px-4 py-2.5 mb-2">
                       <div class="text-[10px] text-cyan-500 font-bold mb-1">VOS</div>

                   </div>`
                : `<div class="chat-msg-ia rounded-lg px-4 py-2.5 mb-2 relative group">
                       <div class="flex justify-between items-center mb-1">
                           <span class="text-[10px] text-slate-500 font-bold">SR. Z IA</span>
                           <button onclick="copiar(this)" data-t="${msg.text.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}"
                               class="opacity-0 group-hover:opacity-100 text-[10px] text-slate-500 hover:text-cyan-400 px-2 py-0.5 rounded border border-slate-800 hover:border-cyan-500/30 transition">
                               Copiar
                           </button>
                       </div>
                       <div class="text-slate-200 text-sm leading-relaxed">${md(msg.text)}</div>
                   </div>`
            ).join('');

            let panelChat = '';
            if (estado.chatHistorial.length > 0 || estado.iaCargando) {
                panelChat = `
                    <div class="border-t border-slate-800/60 bg-[#070a12] p-3 max-h-96 overflow-y-auto" id="chat-scroll">
                        <div class="flex justify-end mb-2">

                        </div>
                        ${chatHTML}
                        ${estado.iaCargando ? `<div class="flex items-center gap-2 px-2 py-3">
                            <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-pulse"></div>
                            <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-pulse" style="animation-delay:.2s"></div>
                            <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-pulse" style="animation-delay:.4s"></div>
                            <span class="text-slate-500 text-xs ml-1">Gemini procesando...</span>
                        </div>` : ''}
                    </div>`;
            } else if (estado.busqueda.trim() && !apiKey) {
                panelChat = `
                    <div class="border-t border-slate-800/60 bg-[#070a12] px-4 py-3 flex items-center justify-between gap-3">
                        <p class="text-xs text-slate-400">Configurá una API Key de Gemini para usar el asistente.</p>
                        <button onclick="abrirKey()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg whitespace-nowrap transition">Configurar</button>
                    </div>`;
            }

            return `

                    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
                        <div class="text-xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-orange-400 tracking-wider">Sr.Z</div>
                        <div class="flex items-center gap-1 md:gap-3">
                            <a href="laboratorio.html" class="text-xs text-slate-400 hover:text-cyan-400 transition px-2 py-1 rounded hover:bg-slate-800/60">⚡ Electrónica</a>
                            <button onclick="cambiarVista('trading_hub')" class="text-xs text-slate-400 hover:text-orange-400 transition px-2 py-1 rounded hover:bg-slate-800/60">📈 Trading</button>
                            <a href="${LINK_DRIVE_RAIZ}" target="_blank" class="text-xs text-slate-400 hover:text-emerald-400 transition px-2 py-1 rounded hover:bg-slate-800/60 hidden md:block">📚 Docs</a>
                            <button onclick="abrirKey()" class="text-xs ${apiKey ? 'text-emerald-400 border-emerald-500/30' : 'text-slate-500 border-slate-800'} border px-2.5 py-1 rounded-lg hover:bg-slate-800/60 transition ml-1">${apiKey ? '● Gemini' : '⚙ API Key'}</button>
                        </div>
                    </div>
                </nav>
                <div id="modal-key" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-[#0d1321] border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
                        <h3 class="text-sm font-bold uppercase text-cyan-400 mb-1">API Key de Gemini</h3>
                        <p class="text-xs text-slate-400 mb-4">Gratis en <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-cyan-400 hover:underline">aistudio.google.com</a>. Compartida con el laboratorio.</p>
                        <input id="key-input" type="password" placeholder="AIzaSy..." class="w-full bg-[#070a12] border border-slate-800 p-2.5 rounded-xl font-mono text-xs focus:outline-none focus:border-cyan-500 mb-4"/>
                        <div class="flex justify-end gap-2">
                            <button onclick="cerrarKey()" class="text-xs text-slate-400 px-3 py-2">Cerrar</button>
                            <button onclick="guardarKey()" class="bg-cyan-500 text-slate-950 text-xs font-bold px-4 py-2 rounded-lg">Guardar</button>
                        </div>
                    </div>
                </div>
                <div class="fade-in">
                    <header class="relative max-w-6xl mx-auto pt-28 pb-10 px-4 text-center z-10">
                        <div class="text-6xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-orange-400 mb-2 filter drop-shadow-[0_0_20px_rgba(6,182,212,0.4)]">Sr. Z</div>
                        <h1 class="text-xl md:text-2xl font-bold text-slate-400 uppercase tracking-wide">Docente de Electrónica <span class="text-slate-600">|</span> <span class="text-orange-400">Trader</span></h1>
                        <div class="mt-8 max-w-3xl mx-auto px-2">

                                <div class="flex items-center px-4 py-3 gap-3">

                                    <input id="buscador-input" type="text" placeholder="Preguntá cualquier cosa: electrónica, trading, física, código..."
                                        value="${estado.busqueda}" class="w-full bg-transparent text-slate-100 placeholder-slate-500 focus:outline-none text-sm font-medium"/>
                                    <input type="file" id="img-upload" accept="image/*" class="hidden" onchange="subirImagen(this)"/>
                                    ${estado.imagenPendiente
                                        ? `<div class="relative shrink-0">

                                           </div>`
                                        : `<button onclick="document.getElementById('img-upload').click()" title="Adjuntar imagen para análisis"
                                               class="text-slate-500 hover:text-cyan-400 transition shrink-0 text-base">📎</button>`

        function renderTradingHub() {
            const inst = INST[estado.parSeleccionado];
            const dinero = estado.balanceCuenta * (estado.riesgoPorcentaje / 100);
            const lotaje = inst ? (dinero / (estado.stopLossPips * inst.pip)).toFixed(2) : '0.00';

            const parBtns = Object.entries(INST).map(([k,v]) =>
                `<button onclick="seleccionarPar('${k}')" class="px-2.5 py-0.5 text-xs font-bold rounded-md transition ${estado.parSeleccionado===k ? 'bg-orange-500 text-slate-950' : 'text-slate-400 hover:text-slate-200'}">${v.label}</button>`
            ).join('');

            return `
                <div class="max-w-[99%] mx-auto p-1 pt-2 fade-in relative">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-2 gap-2 flex-wrap">
                        <div>
                            <button onclick="cambiarVista('home')" class="text-xs text-slate-500 hover:text-orange-400 transition mb-0.5 block">← Panel Central</button>
                            <h1 class="text-base font-black text-slate-200 uppercase tracking-wide">SMC Trading Command</h1>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <div class="flex bg-[#0d1321] p-0.5 rounded-lg border border-slate-800 gap-0.5">${parBtns}</div>
                            <div class="flex items-center gap-1 bg-[#0d1321] border border-slate-800 rounded-lg px-2 py-0.5">
                                <input id="custom-sym" type="text" placeholder="NASDAQ:AAPL…" value="${estado.symbolCustom || ''}"
                                    class="bg-transparent text-slate-300 placeholder-slate-700 text-xs font-mono w-28 focus:outline-none focus:text-slate-100"
                                    onkeydown="if(event.key==='Enter') cambiarSymbol(this.value)"/>
                                <button onclick="cambiarSymbol(document.getElementById('custom-sym').value)" class="text-slate-500 hover:text-orange-400 text-xs transition">→</button>
                            </div>
                            <button onclick="toggleCalc()" class="bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold text-xs px-3 py-1 rounded-md">🧮 Gestión de Riesgo</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-2 mb-2">
                        <div class="bg-[#0d1321] border border-slate-800 rounded-xl overflow-hidden shadow-lg flex flex-col">
                            <div class="bg-slate-950/80 px-3 py-1 text-[10px] font-bold text-slate-400 border-b border-slate-900 uppercase tracking-wider flex items-center gap-2">
                                📅 Calendario Macroeconómico
                                <span class="text-slate-700">· Alta impacto</span>
                            </div>
                            <div class="flex-1 min-h-[160px]" id="tv-events"></div>
                        </div>
                        <div class="bg-[#0d1321] border border-slate-800 rounded-xl overflow-hidden flex flex-col shadow-lg">
                            <div class="bg-slate-950/80 px-3 py-1 text-[10px] font-bold text-cyan-400 border-b border-slate-900 uppercase">📊 Correlación Macro (En Vivo)</div>
                            <div class="w-full flex-1 min-h-[130px] bg-slate-950" id="tv-ticker"></div>
                        </div>
                    </div>

                    <div class="w-full bg-[#0d1321]/60 border border-slate-800 rounded-xl p-1.5 h-[620px] flex flex-col relative mb-2 shadow-2xl">
                        <div id="tv-chart" class="w-full flex-1 rounded-lg overflow-hidden border border-slate-800 bg-slate-950"></div>

                        <div id="calc-panel" class="absolute top-2 right-2 bg-[#0d1321] border border-orange-500/40 rounded-xl p-4 w-72 shadow-2xl transition-all ${estado.calculadoraAbierta ? 'opacity-100 scale-100' : 'opacity-0 scale-95 pointer-events-none'}">
                            <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-1.5">
                                <h3 class="text-orange-400 text-xs font-bold uppercase">🧮 Riesgo — ${inst ? inst.label : ''}</h3>
                                <button onclick="toggleCalc()" class="text-slate-500 hover:text-slate-300 text-xs">✕</button>
                            </div>
                            <div class="space-y-3 text-xs">
                                <div>
                                    <label class="text-slate-400 block mb-0.5">Balance (USD)</label>
                                    <input id="inp-bal" type="number" value="${estado.balanceCuenta}" class="w-full bg-[#070a12] border border-slate-800 p-2 rounded-lg font-mono focus:outline-none focus:border-orange-500/50"/>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-slate-400 block mb-0.5">Riesgo (%)</label>
                                        <input id="inp-riesgo" type="number" step="0.25" value="${estado.riesgoPorcentaje}" class="w-full bg-[#070a12] border border-slate-800 p-2 rounded-lg font-mono focus:outline-none focus:border-orange-500/50"/>
                                    </div>
                                    <div>
                                        <label class="text-slate-400 block mb-0.5">SL (${inst ? inst.unidad : 'pips'})</label>
                                        <input id="inp-sl" type="number" value="${estado.stopLossPips}" class="w-full bg-[#070a12] border border-slate-800 p-2 rounded-lg font-mono focus:outline-none focus:border-orange-500/50"/>
                                    </div>
                                </div>
                                <div class="bg-slate-950 p-3 rounded-lg border border-slate-900 font-mono text-center">
                                    <div class="text-[10px] text-slate-600 mb-1">$${inst ? inst.pip : 10}/pip/lot · ${inst ? inst.unidad : 'pips'}</div>
                                    <div id="calc-neto" class="text-[10px] text-red-400 mb-2">Riesgo neto: -$${dinero.toFixed(2)} USD</div>
                                    <div class="text-slate-400 text-[10px]">Lotaje sugerido</div>
                                    <div id="calc-lot" class="text-emerald-400 text-2xl font-black">${lotaje}</div>
                                </div>
                                <div class="text-[10px] text-slate-700 leading-relaxed">
                                    ${dinero.toFixed(2)} ÷ (${estado.stopLossPips} × $${inst ? inst.pip : 10}) = ${lotaje} lotes
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function inyectarWidget(id, src, cfg) {
            const el = document.getElementById(id);
            if (!el) return;
            el.innerHTML = '';
            const s = document.createElement('script');
            s.type = 'text/javascript';
            s.src = src;
            s.async = true;
            s.innerHTML = JSON.stringify(cfg);
            el.appendChild(s);
        }

        function cargarMercado() {
            inyectarWidget('mkt-calendar',
                'https://s3.tradingview.com/external-embedding/embed-widget-events.js',
                { colorTheme:"dark", isTransparent:true, width:"100%", height:"108",
                  locale:"es", importanceFilter:"0,1", countryFilter:"us,eu,gb,cn,jp,ca,ar" });

            inyectarWidget('mkt-heatmap',
                'https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js',
                { exchanges:[], dataSource:"SPX500", grouping:"sector", blockSize:"market_cap_basic",
                  blockColor:"change", locale:"es", symbolUrl:"", colorTheme:"dark",
                  hasTopBar:false, isDataSetEnabled:false, isZoomEnabled:true,
                  hasSymbolTooltip:true, isMonoSize:false, width:"100%", height:"420" });

            inyectarWidget('mkt-crypto1',
                'https://s3.tradingview.com/external-embedding/embed-widget-crypto-coins-heatmap.js',
                { dataSource:"Crypto", blockSize:"market_cap_basic", blockColor:"change",
                  locale:"es", colorTheme:"dark", width:"100%", height:"196" });

            inyectarWidget('mkt-crypto2',
                'https://s3.tradingview.com/external-embedding/embed-widget-crypto-coins-heatmap.js',
                { dataSource:"Crypto", blockSize:"market_cap_basic", blockColor:"Perf.W",
                  locale:"es", colorTheme:"dark", width:"100%", height:"196" });

            inyectarWidget('mkt-news',
                'https://s3.tradingview.com/external-embedding/embed-widget-timeline.js',
                { feedMode:"all_symbols", colorTheme:"dark", isTransparent:true,
                  displayMode:"compact", width:"100%", height:"420", locale:"es" });
        }

        function cargarTickerHome() {
            const el = document.getElementById('tv-ticker-home');
            if (!el) return;
            el.innerHTML = '';
            const s = document.createElement('script');
            s.type = 'text/javascript';
            s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';
            s.async = true;
            s.innerHTML = JSON.stringify({
                symbols: [
                    { proName:"CAPITALCOM:DXY",  title:"DXY" },
                    { proName:"BLACKBULL:US30",   title:"US30" },
                    { proName:"BINANCE:BTCUSDT",  title:"BTC" },
                    { proName:"TVC:GOLD",         title:"Gold" },
                    { proName:"NASDAQ:QQQ",       title:"NASDAQ" },
                    { proName:"AMEX:SPY",         title:"S&P 500" },
                    { proName:"TVC:USOIL",        title:"Crudo" },
                    { proName:"FX:EURUSD",        title:"EUR/USD" }
                ],
                showSymbolLogo: true, colorTheme:"dark", isTransparent:true, displayMode:"adaptive", locale:"es"
            });
            el.appendChild(s);
        }

        function cambiarSymbol(sym) {
            if (!sym || !sym.trim()) return;
            estado.symbolCustom = sym.trim().toUpperCase();
            const chartEl = document.getElementById('tv-chart');
            if (chartEl) {
                chartEl.innerHTML = '';
                new TradingView.widget({
                    autosize: true, symbol: estado.symbolCustom, interval: "15",
                    timezone: "America/Argentina/Buenos_Aires",
                    theme: "dark", style: "1", locale: "es",
                    container_id: "tv-chart"
                });
            }
        }

        function cargarWidgets() {
            const inst  = INST[estado.parSeleccionado];
            const sym   = estado.symbolCustom || inst.tv;
            if (document.getElementById('tv-chart')) {
                new TradingView.widget({
                    autosize: true, symbol: sym, interval: "15",
                    timezone: "America/Argentina/Buenos_Aires",
                    theme: "dark", style: "1", locale: "es",
                    container_id: "tv-chart"
                });
            }
            // Calendario macro TV Events
            const evEl = document.getElementById('tv-events');
            if (evEl) {
                evEl.innerHTML = '';
                const se = document.createElement('script');
                se.type = 'text/javascript';
                se.src = 'https://s3.tradingview.com/external-embedding/embed-widget-events.js';
                se.async = true;
                se.innerHTML = JSON.stringify({
                    colorTheme: "dark", isTransparent: true,
                    width: "100%", height: "200", locale: "es",
                    importanceFilter: "0,1",
                    countryFilter: "us,eu,gb,jp,cn,de,ar"
                });
                evEl.appendChild(se);
            }
            const tickerEl = document.getElementById('tv-ticker');
            if (tickerEl) {
                tickerEl.innerHTML = "";
                const s = document.createElement('script');
                s.type = 'text/javascript';
                s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';
                s.async = true;
                s.innerHTML = JSON.stringify({
                    symbols: [
                        { proName:"CAPITALCOM:DXY",  title:"DXY" },
                        { proName:"NASDAQ:QQQ",       title:"NASDAQ 100" },
                        { proName:"AMEX:SPY",         title:"S&P 500" },
                        { proName:"TVC:GOLD",         title:"Oro" },
                        { proName:"TVC:USOIL",        title:"Crudo WTI" },
                        { proName:"FX:EURUSD",        title:"EUR/USD" },
                        { proName:"BINANCE:BTCUSDT",  title:"BTC" }
                    ],
                    showSymbolLogo: true, colorTheme:"dark", isTransparent:true, displayMode:"adaptive", locale:"es"
                });
                tickerEl.appendChild(s);
            }
            vincularEventos();
        }

        function vincularEventos() {
            const inp = document.getElementById('buscador-input');
            if (inp) {
                inp.addEventListener('input', e => { estado.busqueda = e.target.value; });
                inp.addEventListener('keydown', e => { if (e.key === 'Enter') consultarIA(); });
            }
            const b = document.getElementById('inp-bal');    if(b) b.addEventListener('input', e => { estado.balanceCuenta = parseFloat(e.target.value)||0; recalc(); });
            const r = document.getElementById('inp-riesgo'); if(r) r.addEventListener('input', e => { estado.riesgoPorcentaje = parseFloat(e.target.value)||0; recalc(); });
            const sl= document.getElementById('inp-sl');     if(sl) sl.addEventListener('input', e => { estado.stopLossPips = parseFloat(e.target.value)||0; recalc(); });
        }

        function recalc() {
            const inst = INST[estado.parSeleccionado];
            const d = estado.balanceCuenta * (estado.riesgoPorcentaje / 100);
            const l = inst ? (d / (estado.stopLossPips * inst.pip)).toFixed(2) : '0.00';
            const n = document.getElementById('calc-neto'); if(n) n.innerText = `Riesgo neto: -$${d.toFixed(2)} USD`;
            const lo= document.getElementById('calc-lot');  if(lo) lo.innerText = l;
        }

        function toggleCalc() {
            estado.calculadoraAbierta = !estado.calculadoraAbierta;
            const p = document.getElementById('calc-panel');
            if(p) { p.classList.toggle('opacity-0'); p.classList.toggle('scale-95'); p.classList.toggle('pointer-events-none'); }
        }

        function seleccionarPar(par) { estado.parSeleccionado = par; estado.symbolCustom = null; render(); }
        function cambiarVista(v)     { estado.vistaActual = v; estado.chatHistorial = []; estado.busqueda = ""; render(); }
        function limpiarChat()       { estado.chatHistorial = []; render(); vincularEventos(); }
        function setQ(t)             { estado.busqueda = t; const i = document.getElementById('buscador-input'); if(i) i.value = t; }

        function copiar(btn) {
            const t = btn.getAttribute('data-t').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
            navigator.clipboard.writeText(t).then(() => {
                const orig = btn.innerHTML;
                btn.innerHTML = '✓ Copiado';
                setTimeout(() => { btn.innerHTML = orig; }, 1500);
            });
        }

        function abrirKey() {
            document.getElementById('modal-key')?.classList.remove('hidden');
            const ki = document.getElementById('key-input');
            if(ki) ki.value = localStorage.getItem('gemini_api_key') || '';
        }
        function cerrarKey() { document.getElementById('modal-key')?.classList.add('hidden'); }
        function guardarKey() { localStorage.setItem('gemini_api_key', document.getElementById('key-input').value.trim()); cerrarKey(); render(); vincularEventos(); }

        function subirImagen(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const dataUrl = e.target.result;
                const base64 = dataUrl.split(',')[1];
                estado.imagenPendiente = { dataUrl, base64, mimeType: file.type };
                render(); vincularEventos();
                setTimeout(() => { document.getElementById('buscador-input')?.focus(); }, 50);
            };
            reader.readAsDataURL(file);
        }

        function limpiarImagen() { estado.imagenPendiente = null; render(); vincularEventos(); }

        async function consultarIA() {
            const inp = document.getElementById('buscador-input');
            const query = (inp ? inp.value : estado.busqueda).trim();
            const img   = estado.imagenPendiente;
            if (!query && !img) return;
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) { estado.busqueda = query; render(); vincularEventos(); return; }

            const msgUser = { role:'user', text: query || '¿Qué ves en esta imagen?', imageUrl: img?.dataUrl || null };
            estado.chatHistorial.push(msgUser);
            estado.iaCargando  = true;
            estado.busqueda    = '';
            estado.imagenPendiente = null;
            render(); vincularEventos();
            setTimeout(() => { const cs = document.getElementById('chat-scroll'); if(cs) cs.scrollTop = cs.scrollHeight; }, 60);

            try {
                const SYS = `Sos el asistente personal de Sr. Z: docente de electrónica (NE555, transistores, amplificadores, fuentes) y trader activo en US30 y BTC con metodología SMC. Respondé en español, directo y técnico. Usá markdown: **negrita**, ## títulos, - listas, \`código inline\`. Si analizás una imagen de un componente o circuito, identificá el componente, sus pines y función.`;
                const contents = [
                    { role:'user',  parts:[{text: SYS}] },
                    { role:'model', parts:[{text: 'Entendido, listo.'}] }
                ];
                for (let i = 0; i < estado.chatHistorial.length - 1; i++) {
                    const m = estado.chatHistorial[i];
                    contents.push({ role: m.role==='user' ? 'user' : 'model', parts:[{text: m.text}] });
                }
                // Último mensaje: puede incluir imagen
                const lastParts = [];
                if (img) lastParts.push({ inlineData: { mimeType: img.mimeType, data: img.base64 } });
                lastParts.push({ text: msgUser.text });
                contents.push({ role:'user', parts: lastParts });

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ contents })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);
                estado.chatHistorial.push({ role:'ia', text: data.candidates[0].content.parts[0].text.trim() });
            } catch(e) {
                estado.chatHistorial.push({ role:'ia', text:`❌ Error: ${e.message || 'Verificá tu API Key en ⚙️.'}` });
            }

            estado.iaCargando = false;
            render(); vincularEventos();
            setTimeout(() => { const cs = document.getElementById('chat-scroll'); if(cs) cs.scrollTop = cs.scrollHeight; }, 60);
        }

        render();
    </script>
</body>
