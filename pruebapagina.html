<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sr. Z - Laboratorio Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#070a12]">

    <div id="root"></div>

    <script type="text/babel">
        function HomeSrZ() {
            const [busqueda, setBusqueda] = React.useState('');
            const sugerencias = ['NE555', 'US30', 'LM317', 'Fibonacci', 'ESP32', 'Gestión de Riesgo'];

            return (
                <div class="min-h-screen text-slate-100 font-sans selection:bg-cyan-500 selection:text-slate-900 overflow-x-hidden pb-12">
                    
                    {/* Luces de fondo (Glow) */}
                    <div class="absolute top-0 left-1/4 w-96 h-96 bg-cyan-500/5 rounded-full blur-[120px] pointer-events-none"></div>
                    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-orange-500/5 rounded-full blur-[120px] pointer-events-none"></div>

                    {/* Hero Section */}
                    <header class="relative max-w-5xl mx-auto pt-16 pb-12 px-4 text-center z-10">
                        <div class="relative inline-block mb-6">
                            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 to-orange-500 rounded-full blur-2xl opacity-20 w-32 h-32 mx-auto"></div>
                            <div class="relative text-6xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-slate-100 to-orange-400 filter drop-shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                                Sr.Z
                            </div>
                        </div>
                        
                        <h1 class="text-xl md:text-2xl font-bold text-slate-400 tracking-wide uppercase">
                            Docente de Electrónica <span class="text-slate-600">|</span> <span class="text-orange-400">Trader</span>
                        </h1>
                        <p class="mt-3 text-sm md:text-base text-slate-500 max-w-xl mx-auto">
                            Laboratorio interactivo de desarrollo técnico, simulación de circuitos y análisis de mercados financieros.
                        </p>

                        {/* Buscador Inteligente */}
                        <div class="mt-10 max-w-2xl mx-auto relative px-2">
                            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500/10 to-orange-500/10 rounded-xl blur-xl opacity-70"></div>
                            <div class="relative flex items-center bg-[#0d1321] border border-slate-800 focus-within:border-cyan-500/50 rounded-xl px-4 py-3.5 transition-all shadow-2xl">
                                <span class="text-xl mr-3 text-slate-500">🔍</span>
                                <input 
                                    type="text"
                                    placeholder="¿Qué quieres aprender o analizar hoy? (Ej: NE555, US30...)"
                                    value={busqueda}
                                    onChange={(e) => setBusqueda(e.target.value)}
                                    class="w-full bg-transparent text-slate-100 placeholder-slate-500 focus:outline-none text-base font-medium"
                                />
                            </div>
                            <div class="mt-3 flex flex-wrap justify-center gap-2 text-xs text-slate-500">
                                <span>Sugerencias:</span>
                                {sugerencias.map((item) => (
                                    <button 
                                        key={item} 
                                        onClick={() => setBusqueda(item)}
                                        class="hover:text-cyan-400 transition-colors cursor-pointer"
                                    >
                                        {item}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    {/* Bento Grid Principal */}
                    <main class="max-w-5xl mx-auto px-4 pb-24 relative z-10">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            
                            {/* Electrónica */}
                            <section class="md:col-span-2 group relative bg-[#0d1321]/60 border border-slate-800 hover:border-cyan-500/40 rounded-2xl p-6 transition-all duration-300 backdrop-blur-md overflow-hidden flex flex-col justify-between h-64">
                                <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl group-hover:bg-cyan-500/20 transition-all duration-300"></div>
                                <div>
                                    <div class="flex items-center space-x-3 text-cyan-400 mb-4">

                                        <h2 class="text-lg font-bold uppercase tracking-wider">Electrónica</h2>
                                    </div>
                                    <p class="text-slate-400 text-sm max-w-md leading-relaxed">
                                        Accede al taller virtual. Diseña circuitos, simula componentes en tiempo real, calcula etapas astables y revisa apuntes técnicos de cátedra.
                                    </p>
                                </div>
                                <div class="flex flex-wrap gap-2 mt-4">
                                    <span class="text-xs bg-cyan-950/60 text-cyan-400 border border-cyan-800/30 px-2.5 py-1 rounded-md">Simulador</span>
                                    <span class="text-xs bg-cyan-950/60 text-cyan-400 border border-cyan-800/30 px-2.5 py-1 rounded-md">Osciloscopio</span>
                                    <span class="text-xs bg-cyan-950/60 text-cyan-400 border border-cyan-800/30 px-2.5 py-1 rounded-md">Calculadoras</span>
                                </div>
                            </section>

                                <div class="absolute top-0 right-0 w-32 h-32 bg-orange-500/10 rounded-full blur-3xl group-hover:bg-orange-500/20 transition-all duration-300"></div>
                                <div>
                                    <div class="flex items-center space-x-3 text-orange-400 mb-4">
                                        <span class="text-2xl">📈</span>
                                        <h2 class="text-lg font-bold uppercase tracking-wider">Trading</h2>
                                    </div>
                                    <p class="text-slate-400 text-sm leading-relaxed">
                                        Análisis técnico enfocado en US30 y Bitcoin bajo Smart Money Concepts. Gestión de riesgo integrada y calculadoras de lotaje.
                                    </p>
                                </div>
                                <div class="flex flex-wrap gap-2 mt-4">
                                    <span class="text-xs bg-orange-950/60 text-orange-400 border border-orange-800/30 px-2.5 py-1 rounded-md">US30</span>
                                    <span class="text-xs bg-orange-950/60 text-orange-400 border border-orange-800/30 px-2.5 py-1 rounded-md">BitCheck</span>
                                    <span class="text-xs bg-orange-950/60 text-orange-400 border border-orange-800/30 px-2.5 py-1 rounded-md">Riesgo</span>
                                </div>
                            </section>

                            {/* Herramientas */}
                            <section class="group relative bg-[#0d1321]/60 border border-slate-800 hover:border-slate-700 rounded-2xl p-6 transition-all duration-300 backdrop-blur-md flex flex-col justify-between h-60">
                                <div>
                                    <div class="flex items-center space-x-3 text-slate-300 mb-4">
                                        <span class="text-xl">🧰</span>
                                        <h2 class="text-base font-bold uppercase tracking-wider">Herramientas</h2>
                                    </div>
                                    <p class="text-slate-400 text-xs leading-relaxed">
                                        Tu ecosistema diario centralizado: accesos rápidos directos a Wokwi, Tinkercad, TradingView y hojas de datos oficiales.
                                    </p>
                                </div>
                                <span class="text-xs text-slate-500 group-hover:text-slate-300 transition-colors flex items-center gap-1 cursor-pointer">
                                    Ver utilidades externas →
                                </span>
                            </section>

                            {/* IA Laboratorio */}
                            <section class="md:col-span-2 group relative bg-[#0a0e1a]/40 border border-slate-900/80 rounded-2xl p-6 overflow-hidden flex flex-col justify-between h-60 select-none">
                                <div>
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="flex items-center space-x-3 text-slate-600">
                                            <span class="text-xl">🤖</span>
                                            <h2 class="text-base font-bold uppercase tracking-wider">IA Sr.Z <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded ml-2">PRÓXIMAMENTE V2</span></h2>

                                        <span class="text-xs text-slate-600 font-mono">⚡ OFFLINE</span>
                                    </div>
                                    <p class="text-slate-600 text-xs max-w-md leading-relaxed">
                                        Asistente predictivo inteligente entrenado con el material didáctico, guías de trabajos prácticos de electrónica y bitácoras de trading propias.
                                    </p>
                                </div>
                                <div class="w-full bg-slate-950/40 rounded border border-slate-900 p-2 font-mono text-[11px] text-slate-700">
                                    <span class="text-emerald-800">sr-z-system:~$</span> learning_model --status [LOCKED]
                                </div>
                            </section>

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HomeSrZ />);
    </script>
</body>
</html>
